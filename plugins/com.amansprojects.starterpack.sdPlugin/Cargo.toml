[package]
name = "opendeck-starterpack"
authors = ["Aman Khanna (nekename)"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
openaction = "2.7"
log = "0.4"
simplelog = "0.12"
serde = "1.0"
serde_json = "1.0"
ron = "0.12"
enigo = { version = "0.6", features = ["serde", "x11rb", "wayland", "libei_tokio"] }
tokio = { version = "1.53", features = ["full"] }
os_pipe = "1.2"
anyhow = "1.0"
ttf-parser = "0.25"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }

[target.'cfg(windows)'.dependencies]
com-policy-config = "0.6"
# com-policy-config 0.6.0 (latest) uses windows 0.61; keep one ABI-compatible
# windows crate version until that dependency publishes a 0.62-compatible release.
windows = { version = "0.61.3", features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Performance",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Shell_PropertiesSystem",
] }
