---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Allow only one concurrent deployment,
# skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want
# to allow these production deployments to complete.
concurrency:
  group: "create-release"
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mistweaverco/opendeck-ajazz-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: linux-app-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            linux-app-bun-${{ hashFiles('bun.lock') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync app version from Git tag
        run: bun run sync:version -- "${GITHUB_REF_NAME}"

      - name: Build Tauri App
        run: |
          NO_STRIP=true bun run tauri build

      - name: Create Release
        run: PLATFORM=linux ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-installers:
    name: Build Windows Installers
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync app version from Git tag
        run: bun run sync:version -- "${{ github.ref_name }}"

      - name: Generate app icons
        run: bun run icon:generate

      - name: Build NSIS and MSI installers
        run: bun run installer:windows

      - name: Upload installers to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis/*.exe", `
            "src-tauri/target/release/bundle/msi/*.msi"

          foreach ($installer in $installers) {
            gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
          }
